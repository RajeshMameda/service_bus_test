# Azure DevOps CI/CD Pipeline for Python Function App
# Triggers on push to main/dev branches

trigger:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - functionapp/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'Azure-Service-Connection'  # Update with your service connection name
  functionAppName: 'service-bus-test'            # Your Function App name
  resourceGroup: 'geo_data'                      # Your resource group
  pythonVersion: '3.11'                          # Azure Functions currently supports up to 3.11
  workingDirectory: '$(System.DefaultWorkingDirectory)/functionapp'

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: Build
        displayName: 'Build Python Function App'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r $(workingDirectory)/requirements.txt
            displayName: 'Install dependencies'

          - script: |
              pip install pytest pytest-cov
              # Add your test commands here when you have tests
              # pytest $(workingDirectory) --cov --cov-report=xml --cov-report=html
            displayName: 'Run tests (optional)'
            continueOnError: true

          - task: ArchiveFiles@2
            displayName: 'Archive function app files'
            inputs:
              rootFolderOrFile: '$(workingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
            artifact: drop
            displayName: 'Publish artifact'

  - stage: Deploy
    displayName: 'Deploy Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: 'Deploy to Azure Function App'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureFunctionApp@1
                  displayName: 'Deploy Azure Function App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'functionAppLinux'
                    appName: '$(functionAppName)'
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                    runtimeStack: 'PYTHON|$(pythonVersion)'
                    deploymentMethod: 'zipDeploy'
                    appSettings: |
                      -FUNCTIONS_WORKER_RUNTIME python
                      -FUNCTIONS_EXTENSION_VERSION ~4
