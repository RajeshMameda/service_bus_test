# GitHub Actions CI/CD Pipeline for Azure Functions
# Alternative to Azure DevOps if you prefer GitHub-native solution

name: Deploy Python Function App to Azure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'functionapp/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'service-bus-test'  # Your Function App name
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './functionapp'
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install dependencies'
        shell: bash
        run: |
          pushd '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          popd

      - name: 'Run tests (optional)'
        shell: bash
        run: |
          # Add your test commands here
          # pip install pytest
          # pytest ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          echo "Tests would run here"

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
